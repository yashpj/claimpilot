# lint -> typecheck -> unit -> integration -> agent evals -> images (GHCR, by SHA)
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://claimpilot:localdev@localhost:5432/claimpilot_test
  EVAL_DATABASE_URL: postgresql://claimpilot:localdev@localhost:5432/claimpilot_test

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: localdev
          POSTGRES_DB: claimpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      # Migrations run in CI against a fresh DB on every push: a migration
      # that can't apply from zero fails here, not in production.
      - run: pnpm migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int

      # ---- agent eval gate (spec §5) ----
      # Replay mode: recorded model outputs (apps/api/evals/cache), so it is
      # deterministic, free and needs no secrets. Any regression below
      # apps/api/evals/baseline.json fails the build. A prompt change misses
      # the cache and fails too, forcing a fresh live recording.
      - name: Agent evals (replay)
        run: pnpm eval
        env:
          EVAL_MODE: replay
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: apps/api/evals/reports/latest.json

  ml-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: python scripts/download_model.py   # also verifies the pinned checksum
      - run: python -m pytest -q

  images:
    # Only from main, only after every gate (incl. evals) passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, ml-service]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: ml-service
            dockerfile: apps/ml-service/Dockerfile
            context: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Immutable tag = git SHA. Never `latest`: a deploy must name exactly
          # what it runs, and a rollback must be able to name what it ran before.
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/claimpilot-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
