server {
  listen 8080;
  root /usr/share/nginx/html;

  # Hashed assets never change => cache forever. index.html must not be
  # cached, or users keep loading an old bundle after a deploy.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location = /healthz {
    access_log off;
    return 200 "ok";
  }
  # SPA fallback: React Router owns every path (same job as vercel.json).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
