apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: claimpilot-raw
spec:
  replicas: 2                      # >1 so one pod can die/roll without downtime
  selector:
    matchLabels: { app: api }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0            # never go below desired capacity during a rollout
      maxSurge: 1                  # add one new pod at a time
  template:
    metadata:
      labels: { app: api }
    spec:
      terminationGracePeriodSeconds: 60   # agent turns can take ~30s; let them finish
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/yashpj/claimpilot-api:REPLACE_WITH_GIT_SHA   # never :latest
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9464 }
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: api-secrets }
          # requests = what the scheduler reserves (and what HPA % is relative to)
          # limits   = hard cap (CPU throttled, memory => OOMKilled)
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          # startup: give boot time before liveness starts judging
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 2
            failureThreshold: 30
          # liveness: "is the process wedged?" -> restart. No DB check here,
          # or a DB outage restarts every pod in a loop.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          # readiness: "send me traffic?" -> removed from Service endpoints if not.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
