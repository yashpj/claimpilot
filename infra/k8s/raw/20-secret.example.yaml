# DO NOT commit real values. Create the real one from your env file:
#   kubectl -n claimpilot-raw create secret generic api-secrets --from-env-file=apps/api/.env
# K8s Secrets are base64, not encryption: anyone with read access to the
# namespace can read them. Real clusters add encryption at rest + RBAC,
# or an external secret manager (sealed-secrets / external-secrets).
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: claimpilot-raw
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:pass@host:5432/db"
  SUPABASE_URL: "https://xxx.supabase.co"
  SUPABASE_ANON_KEY: "xxx"
  SUPABASE_SERVICE_ROLE_KEY: "xxx"
  GEMINI_API_KEY: "xxx"
  STRIPE_SECRET_KEY: "sk_test_xxx"
  STRIPE_WEBHOOK_SECRET: "whsec_xxx"
