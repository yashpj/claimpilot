# Stable virtual IP + DNS name (api.claimpilot-raw.svc) in front of the
# pods that are currently Ready. Pods come and go; the Service doesn't.
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: claimpilot-raw
  labels: { app: api }
spec:
  selector: { app: api }
  ports:
    - { name: http, port: 3000, targetPort: http }
    - { name: metrics, port: 9464, targetPort: metrics }
