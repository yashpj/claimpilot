{{- $ctx := dict "root" . "name" "web" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "cp.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "cp.selector" $ctx | nindent 6 }}
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: {{- include "cp.labels" $ctx | nindent 8 }}
    spec:
      {{- include "cp.podSecurity" . | nindent 6 }}
      containers:
        - name: web
          image: {{ include "cp.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          {{- include "cp.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # nginx temp/pid files
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "cp.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "cp.selector" $ctx | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "cp.selector" $ctx | nindent 6 }}
