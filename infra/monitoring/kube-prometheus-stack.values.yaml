# helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#   -n monitoring --create-namespace -f infra/monitoring/kube-prometheus-stack.values.yaml
# Sized for a laptop k3d cluster.
prometheus:
  prometheusSpec:
    retention: 3d
    # Pick up ServiceMonitors/PrometheusRules from any release/namespace,
    # not only ones labelled for this chart.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 100m, memory: 400Mi }
      limits: { memory: 1Gi }

grafana:
  adminPassword: claimpilot-local   # local cluster only
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard      # our chart's ConfigMap carries this label
      searchNamespace: ALL
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.localhost]

alertmanager:
  alertmanagerSpec:
    # Slack incoming-webhook URL lives in a Secret, never in values:
    #   kubectl -n monitoring create secret generic alertmanager-slack --from-literal=url=https://hooks.slack.com/...
    secrets: [alertmanager-slack]
  config:
    route:
      receiver: slack
      group_by: [alertname]
      group_wait: 30s
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: [alertname = "Watchdog"]
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/url
            channel: "#claimpilot-alerts"
            send_resolved: true
            title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ .Annotations.description }}{{ end }}'

# k3s runs these control-plane parts differently; their scrape targets
# would just show as down.
kubeEtcd: { enabled: false }
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
